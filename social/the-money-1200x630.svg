<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>The spending is public. The source isn’t.</title><desc>Dark card: The spending is public. The source isn’t. Green card, what the FEC filings show: $11,077,173 spent opposing Platner, 97 cents of it through one super PAC, six checks, one ad vendor, every receipt linked. Amber card, what no filing shows: who funded the nonprofit that gave that PAC $3,000,000 — no filing exists, none is required. Amber italic: Public where the law makes it public. Dark where it doesn’t.</desc><metadata><RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><Description></Description></RDF></metadata><rect width="1200" height="630" fill="#15171A"></rect><text x="66" y="66" font-family="Menlo, Consolas, monospace" font-size="13" fill="#D2A75B" letter-spacing="2.34">THE MONEY · A CROSS-REFERENCED LEDGER</text><text x="66" y="130" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="46" fill="#E7E6E2">The spending is public. The source isn’t.</text><rect x="66" y="158" width="1068" height="1" fill="#2C3036"></rect><rect x="66" y="206" width="510" height="230" fill="#1D2024" stroke="#7DBA9C" stroke-width="2"></rect><text x="92" y="246" font-family="Menlo, Consolas, monospace" font-size="16" fill="#7DBA9C" letter-spacing="2.88">WHAT THE FEC FILINGS SHOW</text><text x="92" y="290" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="21" fill="#E7E6E2">$11,077,173 spent opposing Platner —</text><text x="92" y="322" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="21" fill="#E7E6E2">97¢ of it through one super PAC,</text><text x="92" y="354" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="21" fill="#E7E6E2">six checks, one ad vendor.</text><text x="92" y="398" font-family="Menlo, Consolas, monospace" font-size="13" fill="#9AA3AD" letter-spacing="1">EVERY RECEIPT LINKED TO ITS FILING</text><rect x="624" y="206" width="510" height="230" fill="#1D2024" stroke="#D2A75B" stroke-width="2"></rect><text x="650" y="246" font-family="Menlo, Consolas, monospace" font-size="16" fill="#D2A75B" letter-spacing="2.88">WHAT NO FILING SHOWS</text><text x="650" y="290" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="21" fill="#E7E6E2">Who funded the nonprofit that gave</text><text x="650" y="322" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="21" fill="#E7E6E2">that PAC $3,000,000.</text><text x="650" y="366" font-family="Menlo, Consolas, monospace" font-size="13" fill="#9AA3AD" letter-spacing="1">NO FILING EXISTS — NONE IS REQUIRED</text><text x="66" y="510" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="30" fill="#D2A75B" font-style="italic">Public where the law makes it public. Dark where it doesn’t.</text><text x="66" y="586" font-family="Menlo, Consolas, monospace" font-size="15" fill="#9AA3AD">the ledger → daguilar0123.github.io/graham-platner-campaign-finance</text></svg>