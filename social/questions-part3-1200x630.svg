<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Part 3 — then charge him</title><desc>Dark card, part 3 of 3: Why is no one calling for an investigation? Take their claims at full strength — all of them: “You can indict a ham sandwich” — the bar to charge is famously low. “The trifecta” of corroborating evidence — commentator Hasan Piker’s description of the case. And Platner is, they say, a dangerous man — the portrait painted across 35 catalogued stories. Amber italic: Then it is incumbent upon the state to charge him. So why is no one asking it to?</desc><metadata><RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><Description></Description></RDF></metadata><rect width="1200" height="630" fill="#15171A"></rect><text x="66" y="66" font-family="Menlo, Consolas, monospace" font-size="13" fill="#D2A75B" letter-spacing="2.34">EDITORIAL SERIES · PART 3 OF 3 · THE PLATNER RECORD</text><text x="66" y="130" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="46" fill="#E7E6E2">Why is no one calling for an investigation?</text><rect x="66" y="158" width="1068" height="1" fill="#2C3036"></rect><text x="66" y="222" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="32" fill="#E7E6E2">Take their claims at full strength — all of them:</text><rect x="66" y="252" width="4" height="60" fill="#7FA5BC"></rect><text x="92" y="280" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="24" fill="#E7E6E2" font-style="italic">“You can indict a ham sandwich.”</text><text x="92" y="308" font-family="Menlo, Consolas, monospace" font-size="13" fill="#9AA3AD" letter-spacing="1">THE BAR TO CHARGE IS FAMOUSLY LOW</text><rect x="66" y="332" width="4" height="60" fill="#7FA5BC"></rect><text x="92" y="360" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="24" fill="#E7E6E2" font-style="italic">“The trifecta” of corroborating evidence.</text><text x="92" y="388" font-family="Menlo, Consolas, monospace" font-size="13" fill="#9AA3AD" letter-spacing="1">COMMENTATOR HASAN PIKER’S DESCRIPTION OF THE CASE</text><rect x="66" y="412" width="4" height="60" fill="#7FA5BC"></rect><text x="92" y="440" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="24" fill="#E7E6E2" font-style="italic">And Platner is, they say, a dangerous man.</text><text x="92" y="468" font-family="Menlo, Consolas, monospace" font-size="13" fill="#9AA3AD" letter-spacing="1">THE PORTRAIT PAINTED ACROSS 35 CATALOGUED STORIES</text><text x="66" y="540" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="32" fill="#D2A75B" font-style="italic">Then it is incumbent upon the state to charge him.</text><text x="66" y="582" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="26" fill="#E7E6E2" font-style="italic">So why is no one asking it to?</text><text x="1134" y="610" font-family="Menlo, Consolas, monospace" font-size="14" fill="#9AA3AD" text-anchor="end">the full argument → daguilar0123.github.io/graham-platner-the-record/the-questions.html</text></svg>