<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Part 2 — reviewed is not tested</title><desc>Dark card, part 2 of 3. “Reporters reviewed the evidence.” That ends the inquiry — it should begin it. Green box: what a newsroom can do — read screenshots and emails; by their own account they could not review the direct messages. Amber box: what only an investigation can do — phone data, app records, message metadata, under warrant and chain of custody. Amber italic: digital evidence is testable — that is the point of it.</desc><metadata><RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><Description></Description></RDF></metadata><rect width="1200" height="630" fill="#15171A"></rect><text x="66" y="66" font-family="Menlo, Consolas, monospace" font-size="13" fill="#D2A75B" letter-spacing="2.34">EDITORIAL SERIES · PART 2 OF 3 · THE PLATNER RECORD</text><text x="66" y="130" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="46" fill="#E7E6E2">Why is no one calling for an investigation?</text><rect x="66" y="158" width="1068" height="1" fill="#2C3036"></rect><text x="66" y="226" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="32" fill="#E7E6E2">“Reporters reviewed the evidence.” That ends the inquiry —</text><text x="66" y="270" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="32" fill="#E7E6E2">it should begin it.</text><rect x="66" y="306" width="510" height="200" fill="#1D2024" stroke="#7DBA9C" stroke-width="2"></rect><text x="92" y="344" font-family="Menlo, Consolas, monospace" font-size="16" fill="#7DBA9C" font-weight="bold">WHAT A NEWSROOM CAN DO</text><text x="92" y="382" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="20" fill="#E7E6E2">read screenshots &amp; emails —</text><text x="92" y="412" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="20" fill="#E7E6E2">by their own account, they could</text><text x="92" y="442" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="20" fill="#E7E6E2">not review the direct messages</text><text x="92" y="472" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="20" fill="#E7E6E2">between the two people involved</text><rect x="624" y="306" width="510" height="200" fill="#1D2024" stroke="#D2A75B" stroke-width="2"></rect><text x="650" y="344" font-family="Menlo, Consolas, monospace" font-size="16" fill="#D2A75B" font-weight="bold">WHAT ONLY AN INVESTIGATION CAN DO</text><text x="650" y="382" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="20" fill="#E7E6E2">phone data, app records, message</text><text x="650" y="412" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="20" fill="#E7E6E2">metadata — under warrant, under</text><text x="650" y="442" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="20" fill="#E7E6E2">chain of custody, examined by</text><text x="650" y="472" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="20" fill="#E7E6E2">people accountable for accuracy</text><text x="66" y="565" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="26" fill="#D2A75B" font-style="italic">Digital evidence is testable. That is the point of it.</text><text x="1134" y="610" font-family="Menlo, Consolas, monospace" font-size="14" fill="#9AA3AD" text-anchor="end">part 3: then charge him → daguilar0123.github.io/graham-platner-the-record/the-questions.html</text></svg>