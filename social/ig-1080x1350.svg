<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Three waves — the timing record</title><desc>Portrait dark card titled “Three waves.” Three banded cards: Wave 1 Oct–Nov 2025 Reddit posts and the tattoo; Wave 2 May–Jun 2026 texts and dating history; Wave 3 Jul 2026 the assault allegation. Beneath: “There is a reason that this is happening now.” — Platner’s withdrawal statement, the timing claim, checked on the page.</desc><metadata><RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><Description></Description></RDF></metadata><rect width="1080" height="1350" fill="#15171A"></rect><text x="66" y="84" font-family="Menlo, Consolas, monospace" font-size="15" fill="#9AA3AD" letter-spacing="2.6999999999999997">THE PLATNER RECORD · THE TIMING RECORD</text><text x="66" y="170" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="56" fill="#E7E6E2">Three waves.</text><text x="66" y="222" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="26" fill="#9AA3AD">Every major negative story, catalogued — 35 records,</text><text x="66" y="258" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="26" fill="#9AA3AD">each dated, sourced, and archived.</text><rect x="66" y="340" width="948" height="190" fill="#1D2024" stroke="#2C3036" stroke-width="1"></rect><rect x="66" y="340" width="5" height="190" fill="#7FA5BC"></rect><text x="98" y="388" font-family="Menlo, Consolas, monospace" font-size="17" fill="#7FA5BC" font-weight="bold">WAVE 1 · OCT–NOV 2025</text><text x="98" y="440" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="33" fill="#E7E6E2">Reddit posts &amp; the tattoo</text><text x="98" y="485" font-family="Menlo, Consolas, monospace" font-size="17" fill="#9AA3AD">12 STORIES IN THE HEAVIEST MONTH</text><rect x="66" y="562" width="948" height="190" fill="#1D2024" stroke="#2C3036" stroke-width="1"></rect><rect x="66" y="562" width="5" height="190" fill="#7FA5BC"></rect><text x="98" y="610" font-family="Menlo, Consolas, monospace" font-size="17" fill="#7FA5BC" font-weight="bold">WAVE 2 · MAY–JUN 2026</text><text x="98" y="662" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="33" fill="#E7E6E2">texts &amp; dating history</text><text x="98" y="707" font-family="Menlo, Consolas, monospace" font-size="17" fill="#9AA3AD">THE WEEK BEFORE THE JUNE 9 PRIMARY</text><rect x="66" y="784" width="948" height="190" fill="#1D2024" stroke="#2C3036" stroke-width="1"></rect><rect x="66" y="784" width="5" height="190" fill="#7FA5BC"></rect><text x="98" y="832" font-family="Menlo, Consolas, monospace" font-size="17" fill="#7FA5BC" font-weight="bold">WAVE 3 · JUL 2026</text><text x="98" y="884" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="33" fill="#E7E6E2">the assault allegation</text><text x="98" y="929" font-family="Menlo, Consolas, monospace" font-size="17" fill="#9AA3AD">BEFORE THE JULY 13 BALLOT DEADLINE</text><text x="66" y="1061" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="25" fill="#9AA3AD" font-style="italic">“There is a reason that this is happening now.”</text><text x="66" y="1101" font-family="Menlo, Consolas, monospace" font-size="16" fill="#9AA3AD">— PLATNER’S WITHDRAWAL STATEMENT · THE TIMING CLAIM, CHECKED ON THE PAGE</text><text x="59" y="1290" font-family="Menlo, Consolas, monospace" font-size="17" fill="#9AA3AD">the catalog, filterable → daguilar0123.github.io/graham-platner-the-record</text></svg>