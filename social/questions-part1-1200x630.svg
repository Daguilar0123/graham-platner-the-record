<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Part 1 — they called for withdrawal, never an investigation</title><desc>Dark card, part 1 of 3: “Why is no one calling for an investigation?” Within hours, officials demanded Platner leave the race; we swept every quoted statement in the reaction coverage. A green checked box: called for Platner’s withdrawal — every statement. An empty amber box: called for an investigation — zero. Italic: if you are certain enough to end a candidacy, why not certain enough to ask for the process with subpoenas?</desc><metadata><RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><Description></Description></RDF></metadata><rect width="1200" height="630" fill="#15171A"></rect><text x="66" y="66" font-family="Menlo, Consolas, monospace" font-size="13" fill="#D2A75B" letter-spacing="2.34">EDITORIAL SERIES · PART 1 OF 3 · THE PLATNER RECORD</text><text x="66" y="130" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="46" fill="#E7E6E2">Why is no one calling for an investigation?</text><rect x="66" y="158" width="1068" height="1" fill="#2C3036"></rect><text x="66" y="222" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="30" fill="#E7E6E2">Within hours, officials demanded Platner leave the race.</text><text x="66" y="264" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="30" fill="#E7E6E2">We swept every quoted statement in the reaction coverage:</text><rect x="80" y="308" width="44" height="44" fill="none" stroke="#7DBA9C" stroke-width="5"></rect><path d="M89,332 L98,342 L116,317" stroke="#7DBA9C" stroke-width="7" fill="none" stroke-linecap="round"></path><text x="150" y="330" font-family="Menlo, Consolas, monospace" font-size="20" fill="#E7E6E2" font-weight="bold">CALLED FOR PLATNER’S WITHDRAWAL</text><text x="150" y="360" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="24" fill="#7DBA9C" font-style="italic">every statement</text><rect x="80" y="412" width="44" height="44" fill="none" stroke="#D2A75B" stroke-width="5"></rect><text x="150" y="434" font-family="Menlo, Consolas, monospace" font-size="20" fill="#E7E6E2" font-weight="bold">CALLED FOR AN INVESTIGATION</text><text x="150" y="464" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="24" fill="#D2A75B" font-style="italic">zero</text><text x="66" y="548" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="26" fill="#E7E6E2" font-style="italic">If you are certain enough to end a candidacy,</text><text x="66" y="586" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="26" fill="#D2A75B" font-style="italic">why not certain enough to ask for the process with subpoenas?</text><text x="1134" y="610" font-family="Menlo, Consolas, monospace" font-size="14" fill="#9AA3AD" text-anchor="end">part 2: “we reviewed the evidence” → daguilar0123.github.io/graham-platner-the-record/the-questions.html</text></svg>