<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Why is no one calling for an investigation? — series cover</title><desc>Dark card: Why is no one calling for an investigation? — editorial, a three-part series. Part 1: every statement demanded Platner’s withdrawal, zero demanded an investigation. Part 2: “we reviewed the evidence” should begin the inquiry, not end it. Part 3: take the claims at full strength — then charging is the state’s duty. So why the silence?</desc><metadata><RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><Description></Description></RDF></metadata><rect width="1200" height="630" fill="#15171A"></rect><text x="66" y="72" font-family="Menlo, Consolas, monospace" font-size="14" fill="#D2A75B" letter-spacing="2.52">EDITORIAL · A THREE-PART SERIES · THE PLATNER RECORD</text><text x="66" y="185" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="68" fill="#E7E6E2">Why is no one calling</text><text x="66" y="270" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="68" fill="#E7E6E2">for an investigation?</text><rect x="66" y="330" width="1068" height="62" fill="#1D2024"></rect><rect x="66" y="330" width="4" height="62" fill="#D2A75B"></rect><text x="92" y="368" font-family="Menlo, Consolas, monospace" font-size="15" fill="#D2A75B" font-weight="bold">PART 1</text><text x="190" y="370" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="21" fill="#E7E6E2">Every statement demanded Platner’s withdrawal. Zero demanded an investigation.</text><rect x="66" y="408" width="1068" height="62" fill="#1D2024"></rect><rect x="66" y="408" width="4" height="62" fill="#D2A75B"></rect><text x="92" y="446" font-family="Menlo, Consolas, monospace" font-size="15" fill="#D2A75B" font-weight="bold">PART 2</text><text x="190" y="448" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="21" fill="#E7E6E2">“We reviewed the evidence” should begin the inquiry — not end it.</text><rect x="66" y="486" width="1068" height="62" fill="#1D2024"></rect><rect x="66" y="486" width="4" height="62" fill="#D2A75B"></rect><text x="92" y="524" font-family="Menlo, Consolas, monospace" font-size="15" fill="#D2A75B" font-weight="bold">PART 3</text><text x="190" y="526" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="21" fill="#E7E6E2">Take the claims at full strength — then charging is the state’s duty. So why the silence?</text><text x="66" y="602" font-family="Menlo, Consolas, monospace" font-size="15" fill="#9AA3AD">COMMENTARY — CLEARLY LABELED · OUR BIAS DECLARED · OUR PLEDGE FALSIFIABLE</text></svg>