<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><title>Every allegation gets asked one question</title><desc>Square dark card: “Every allegation on this record gets asked one question:” A large empty amber box beside charged? court finding? independently verified? Amber italic: As of July 11, 2026: the box is empty. Closing: Allegations written as allegations. Denials written as denials.</desc><metadata><RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><Description></Description></RDF></metadata><rect width="1080" height="1080" fill="#15171A"></rect><text x="66" y="84" font-family="Menlo, Consolas, monospace" font-size="14" fill="#9AA3AD" letter-spacing="2.52">THE PLATNER RECORD</text><text x="66" y="168" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="54" fill="#E7E6E2">Every allegation on this record</text><text x="66" y="234" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="54" fill="#E7E6E2">gets asked one question:</text><rect x="120" y="330" width="220" height="220" fill="none" stroke="#D2A75B" stroke-width="13"></rect><text x="400" y="392" font-family="Menlo, Consolas, monospace" font-size="30" fill="#E7E6E2">CHARGED?</text><text x="400" y="447" font-family="Menlo, Consolas, monospace" font-size="30" fill="#E7E6E2">COURT FINDING?</text><text x="400" y="502" font-family="Menlo, Consolas, monospace" font-size="30" fill="#E7E6E2">INDEPENDENTLY</text><text x="400" y="540" font-family="Menlo, Consolas, monospace" font-size="30" fill="#E7E6E2">VERIFIED?</text><text x="540" y="690" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="40" fill="#D2A75B" font-style="italic" text-anchor="middle">As of July 11, 2026: the box is empty.</text><text x="540" y="765" font-family="Menlo, Consolas, monospace" font-size="19" fill="#9AA3AD" text-anchor="middle">NO CHARGE · NO COURT FINDING · NO INDEPENDENT</text><text x="540" y="800" font-family="Menlo, Consolas, monospace" font-size="19" fill="#9AA3AD" text-anchor="middle">VERIFICATION — IN ANY DIRECTION, ON ANY ALLEGATION</text><text x="540" y="900" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="24" fill="#E7E6E2" text-anchor="middle">Allegations written as allegations. Denials written as denials.</text><text x="59" y="1032" font-family="Menlo, Consolas, monospace" font-size="17" fill="#9AA3AD">weigh the record yourself → daguilar0123.github.io/graham-platner-the-record</text></svg>