<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Reviewed is not authenticated — The Platner Record</title><desc>Dark card. Kicker: The Platner Record, a note on standards. Serif headline: Reviewed is not authenticated. Two columns contrast REVIEWED, an editorial judgment, with AUTHENTICATED, a standard of proof, beside an amber unchecked box. Footer: examined is not confirmed; the standard applies to everyone.</desc><metadata><RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><Description></Description></RDF></metadata><rect width="1200" height="630" fill="#15171A"></rect><text x="66" y="74" font-family="Menlo, Consolas, monospace" font-size="14" fill="#9AA3AD" letter-spacing="2.52">THE PLATNER RECORD · A NOTE ON STANDARDS</text><text x="66" y="156" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="60" fill="#E7E6E2">Reviewed is not authenticated.</text><rect x="66" y="196" width="1068" height="2" fill="#E7E6E2"></rect><text x="66" y="292" font-family="Menlo, Consolas, monospace" font-size="15" fill="#D2A75B" letter-spacing="1.2">REVIEWED</text><text x="66" y="338" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="30" fill="#E7E6E2">An editorial judgment</text><text x="66" y="378" font-family="Menlo, Consolas, monospace" font-size="15" fill="#9AA3AD">A reporter looked, and judged it</text><text x="66" y="402" font-family="Menlo, Consolas, monospace" font-size="15" fill="#9AA3AD">credible enough to publish.</text><rect x="590" y="256" width="1" height="170" fill="#2C3036"></rect><text x="636" y="292" font-family="Menlo, Consolas, monospace" font-size="15" fill="#7FA5BC" letter-spacing="1.2">AUTHENTICATED</text><text x="636" y="338" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="30" fill="#E7E6E2">A standard of proof</text><text x="636" y="378" font-family="Menlo, Consolas, monospace" font-size="15" fill="#9AA3AD">Shown, under a defined test, to be</text><text x="636" y="402" font-family="Menlo, Consolas, monospace" font-size="15" fill="#9AA3AD">what it is claimed to be.</text><rect x="1070" y="256" width="44" height="44" fill="none" stroke="#D2A75B" stroke-width="6"></rect><text x="66" y="468" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="24" font-style="italic" fill="#9AA3AD">&#8220;Sort of&#8221; is not &#8220;confirmed.&#8221; The standard applies to everyone.</text><rect x="66" y="506" width="1068" height="1" fill="#2C3036"></rect><text x="66" y="596" font-family="Menlo, Consolas, monospace" font-size="16" fill="#9AA3AD">makes no finding of fact · reads the words as given → …/graham-platner-the-record/reviewed-not-authenticated.html</text></svg>
