<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>The Fifield–Kavanaugh File — 2018 vs 2026</title><desc>Dark card titled The Fifield–Kavanaugh File. Green-bordered card, 2018, the Kavanaugh confirmation: she vehemently defended Kavanaugh against allegations she called baseless — publicly, repeatedly, in writing; recovered verbatim from archive captures. Amber-bordered card, 2026, the Platner race: those posts are deleted from X — and her position has flipped; deleted does not mean gone — Wayback and archive.today snapshots, dated, linked, graded. Large amber italic: We have the receipts.</desc><metadata><RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><Description></Description></RDF></metadata><rect width="1200" height="630" fill="#15171A"></rect><text x="66" y="66" font-family="Menlo, Consolas, monospace" font-size="13" fill="#9AA3AD" letter-spacing="2.34">DOCUMENTARY FILE · VERBATIM ONLY</text><text x="66" y="128" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="50" fill="#E7E6E2">The Fifield–Kavanaugh File</text><rect x="66" y="170" width="520" height="230" fill="#1D2024" stroke="#7DBA9C" stroke-width="2"></rect><text x="92" y="210" font-family="Menlo, Consolas, monospace" font-size="15" fill="#7DBA9C" letter-spacing="2.6999999999999997">2018 · THE KAVANAUGH CONFIRMATION</text><text x="92" y="252" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="23" fill="#E7E6E2">She vehemently defended Kavanaugh</text><text x="92" y="286" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="23" fill="#E7E6E2">against allegations she called baseless —</text><text x="92" y="320" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="23" fill="#E7E6E2">publicly, repeatedly, in writing.</text><text x="92" y="372" font-family="Menlo, Consolas, monospace" font-size="13" fill="#9AA3AD" letter-spacing="1">RECOVERED VERBATIM FROM ARCHIVE CAPTURES</text><rect x="614" y="170" width="520" height="230" fill="#1D2024" stroke="#D2A75B" stroke-width="2"></rect><text x="640" y="210" font-family="Menlo, Consolas, monospace" font-size="15" fill="#D2A75B" letter-spacing="2.6999999999999997">2026 · THE PLATNER RACE</text><text x="640" y="252" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="23" fill="#E7E6E2">Those posts are deleted from X —</text><text x="640" y="286" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="23" fill="#E7E6E2">and her position has flipped.</text><text x="640" y="338" font-family="Menlo, Consolas, monospace" font-size="13" fill="#9AA3AD" letter-spacing="1">DELETED ≠ GONE · WAYBACK + ARCHIVE.TODAY</text><text x="640" y="364" font-family="Menlo, Consolas, monospace" font-size="13" fill="#9AA3AD" letter-spacing="1">SNAPSHOTS · DATED · LINKED · GRADED</text><text x="66" y="470" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="44" fill="#D2A75B" font-style="italic">We have the receipts.</text><text x="66" y="516" font-family="Menlo, Consolas, monospace" font-size="14" fill="#9AA3AD" letter-spacing="1">EVERY LINE HUMAN-CHECKED · EVERY GAP DECLARED ON THE PAGE</text><text x="66" y="586" font-family="Menlo, Consolas, monospace" font-size="15" fill="#9AA3AD">the file → daguilar0123.github.io/graham-platner-the-record/fifield-kavanaugh.html</text></svg>